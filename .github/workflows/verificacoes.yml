# Verifica ramos e propostas de alteracao. A main tem pipeline propria em publicar.yml.
name: Verificacoes

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Impressao, cardapio, campanha e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
